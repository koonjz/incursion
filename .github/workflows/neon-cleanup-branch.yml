name: Cleanup Neon Preview Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup-neon-branch:
    name: Delete Neon Preview Branch
    runs-on: ubuntu-latest
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    steps:
      - name: Delete Neon Ephemeral Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Comment Teardown Status on PR
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = `preview/pr-${context.payload.pull_request.number}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `### 🧹 Neon Preview Branch Deleted\n\nThe ephemeral database branch \`${branchName}\` has been cleanly decommissioned.`
            });
